<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PrivacyYouTuber — Cosmic Reveal</title>
<style>
  @font-face { font-family:'DancingScript'; src:url('fonts/DancingScript.ttf') format('truetype'); font-weight:700; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; background:#04030a; overflow:hidden;
    font-family:"Segoe UI",system-ui,sans-serif; }

  #sky { position:absolute; inset:0; }

  /* ── VOLUMETRIC RAYS ── */
  .rays {
    position:absolute; inset:-30%;
    background:
      conic-gradient(from 200deg at 50% 46%,
        transparent 0deg, rgba(150,90,255,.10) 30deg, transparent 60deg,
        transparent 120deg, rgba(200,60,180,.09) 150deg, transparent 180deg,
        transparent 250deg, rgba(110,140,255,.10) 285deg, transparent 320deg);
    animation: raySweep 14s linear infinite;
    pointer-events:none;
  }
  @keyframes raySweep { to { transform: rotate(360deg); } }

  /* ── SHIELD (σχηματίζεται) ── */
  .shield {
    position:absolute; left:50%; top:44%;
    width:34vmin; height:34vmin;
    transform:translate(-50%,-50%) scale(.1) rotateY(60deg);
    opacity:0;
    animation: shieldForm 2.6s 2.2s cubic-bezier(.18,.9,.25,1) forwards;
  }
  .shield img { width:100%; height:100%; object-fit:contain;
    filter: drop-shadow(0 0 34px rgba(180,90,255,.65)) drop-shadow(0 0 70px rgba(120,80,255,.35)); }

  .burst {
    position:absolute; left:50%; top:44%;
    width:8vmin; height:8vmin; border-radius:50%;
    transform:translate(-50%,-50%) scale(0);
    background: radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(190,110,255,.5) 40%, transparent 70%);
    animation: burst 1.1s 4.4s ease-out forwards;
    pointer-events:none;
  }
  @keyframes burst {
    0%   { transform:translate(-50%,-50%) scale(0); opacity:1; }
    100% { transform:translate(-50%,-50%) scale(16); opacity:0; }
  }

  /* ── ΚΕΙΜΕΝΟ (3D) ── */
  .line { position:absolute; left:0; right:0; text-align:center;
    transform-style:preserve-3d; will-change:transform,opacity; }

  .l1 {
    top:68%;
    font-size:7.4vmin; font-weight:800; letter-spacing:-.5px;
    animation: rise 1.8s 5.0s cubic-bezier(.2,.85,.3,1) both;
  }
  .l1 .p1 { color:#e8ecff; text-shadow:0 0 16px rgba(200,210,255,.55), 0 3px 0 #8b93b8, 0 5px 12px rgba(0,0,0,.6); }
  .l1 .p2 { color:#cc0000; text-shadow:0 0 22px rgba(204,0,0,.75), 0 3px 0 #7a0000, 0 5px 12px rgba(0,0,0,.6); }

  .l2 {
    top:79%;
    font-family:'DancingScript',cursive; font-size:5.6vmin; font-weight:700;
    color:#e6d9ff; text-shadow:0 0 18px rgba(190,150,255,.6);
    animation: rise 1.8s 6.2s cubic-bezier(.2,.85,.3,1) both;
  }
  .l2 span { display:inline-block; animation: sway 3.6s 8.0s ease-in-out infinite; }

  @keyframes shieldForm {
    0%   { opacity:0; transform:translate(-50%,-50%) scale(.1) rotateY(60deg); filter:blur(10px); }
    55%  { opacity:1; filter:blur(2px); }
    100% { opacity:1; transform:translate(-50%,-50%) scale(1) rotateY(0deg); filter:blur(0); }
  }
  @keyframes rise {
    0%   { opacity:0; transform:translateY(0vh) rotateX(-75deg) scale(1.45); }
    60%  { opacity:1; }
    100% { opacity:1; transform:translateY(0) rotateX(0deg) scale(1); }
  }
  @keyframes sway {
    0%,100% { transform:translateY(0) rotate(-1.1deg); }
    50%     { transform:translateY(-6px) rotate(1.1deg); }
  }
</style>
</head>
<body>
  <canvas id="sky"></canvas>
  <div class="rays"></div>
  <div class="burst"></div>
  <div class="shield"><img src="LOGO.png" alt=""></div>
  <div class="line l1"><span class="p1">Privacy</span><span class="p2">YouTuber</span></div>
  <div class="line l2"><span>Your YouTube, on your own terms</span></div>

<script>
/* ── CANVAS: αστέρια που συγκλίνουν + σπίθες ── */
const cv = document.getElementById('sky');
const cx = cv.getContext('2d');
let W, H, CX, CY;
function resize(){ W=cv.width=innerWidth; H=cv.height=innerHeight; CX=W/2; CY=H*.44; }
resize(); addEventListener('resize', resize);

const N = 420;
const stars = Array.from({length:N}, () => {
  const a = Math.random()*Math.PI*2;
  const r = 380 + Math.random()*Math.max(W,H)*0.75;
  return { a, r, sp: .6 + Math.random()*2.2, sz: .5 + Math.random()*1.7,
           tw: Math.random()*Math.PI*2, hue: 200 + Math.random()*90 };
});

let t0 = performance.now();
function frame(now){
  const t = (now - t0) / 1000;
  cx.clearRect(0,0,W,H);
  cx.globalCompositeOperation = 'lighter';

  // βάθος: αστέρια
  for (const s of stars){
    // μετά τα 2.2s, επιταχύνουν προς το κέντρο (galaxy collapse)
    const pull = t > 2.0 ? Math.min((t-2.0)/3.2, 1) : 0;
    s.r -= s.sp * (1 + pull*7);
    if (s.r < 6) { s.a = Math.random()*Math.PI*2; s.r = 380 + Math.random()*Math.max(W,H)*0.7; }
    const x = CX + Math.cos(s.a)*s.r;
    const y = CY + Math.sin(s.a)*s.r*0.62;
    const tw = .45 + .55*Math.sin(s.tw + t*2.4);
    const al = Math.max(0, Math.min(1, (1 - s.r/(Math.max(W,H)*0.95)))) * tw;
    const g = cx.createRadialGradient(x,y,0,x,y,s.sz*4);
    g.addColorStop(0, `hsla(${s.hue},95%,88%,${al})`);
    g.addColorStop(1, 'transparent');
    cx.fillStyle = g;
    cx.beginPath(); cx.arc(x,y,s.sz*4,0,7); cx.fill();
  }

  // σπίθες μετά το burst (4.4s)
  if (t > 4.4){
    for (let i=0;i<70;i++){
      const lt = (t - 4.4) % 2.4;
      const p = lt/2.4;
      const a = (i/70)*Math.PI*2 + i*0.11;
      const rr = 6 + p * (120 + (i%7)*34);
      const x = CX + Math.cos(a)*rr;
      const y = CY + Math.sin(a)*rr*0.7;
      const al = (1-p) * .9;
      cx.fillStyle = `hsla(${20 + (i%5)*28}, 100%, ${62 + (i%3)*10}%, ${al})`;
      cx.beginPath(); cx.arc(x,y, 1.5 + (1-p)*1.6, 0, 7); cx.fill();
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
