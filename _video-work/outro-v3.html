<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PrivacyYouTuber — Outro v3</title>
<style>
  @font-face {
    font-family: 'DancingScript';
    src: url('fonts/DancingScript.ttf') format('truetype');
    font-weight: 700;
  }
  @font-face {
    font-family: 'CaveatLocal';
    src: url('fonts/Caveat.ttf') format('truetype');
    font-weight: 700;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #ffffff;
    overflow: hidden;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  #stage {
    position: absolute; inset: 0;
    perspective: 1400px;
    perspective-origin: 50% 45%;
    display: flex; align-items: center; justify-content: center;
  }

  /* ── ΛΟΓΟΤΥΠΟ ── */
  .logo-wrap {
    position: absolute;
    left: 50%; top: 46%;
    transform: translate(-50%, -50%);
    width: 40vmin; height: 40vmin;
    opacity: 0;
    animation: logoIn 1.4s 0.2s ease-out forwards;
  }
  .logo-wrap img {
    width: 100%; height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 0 24px rgba(204,0,0,.22)) drop-shadow(0 6px 20px rgba(60,90,200,.16));
  }
  .halo {
    position: absolute; inset: -16%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(204,0,0,.16) 0%, rgba(204,0,0,.05) 42%, transparent 70%);
    animation: pulse 2.6s 1s ease-in-out infinite;
    pointer-events: none;
  }

  /* ── ΣΠΙΘΕΣ ── */
  .spark {
    position: absolute;
    left: 50%; top: 46%;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: #cc0000;
    box-shadow: 0 0 7px 2px rgba(204,0,0,.6);
    opacity: 0;
    animation: spark 2.4s ease-out infinite;
  }

  /* ── ΤΙΤΛΟΣ ── */
  .line { position: absolute; left: 0; right: 0; text-align: center; transform-style: preserve-3d; will-change: transform, opacity; }

  .l1 {
    top: 68.5%;
    font-size: 7.4vmin;
    font-weight: 800;
    letter-spacing: -.5px;
    animation: drop1 1.5s 1.6s cubic-bezier(.2,.85,.3,1) both;
  }
  .l1 .p1 { color: #0d1117; }
  .l1 .p2 { color: #cc0000; text-shadow: 0 0 24px rgba(204,0,0,.35); }

  /* ── SLOGAN: χειρόγραφο + κινούμενο ── */
  .l2 {
    top: 79.5%;
    font-family: 'DancingScript', 'CaveatLocal', cursive;
    font-size: 5.6vmin;
    font-weight: 700;
    letter-spacing: .5px;
    color: #3a7bd5;
    text-shadow: 0 2px 12px rgba(58,123,213,.20);
    animation: drop2 1.6s 2.6s cubic-bezier(.2,.85,.3,1) both;
  }
  /* εσωτερικό span: κύμανση μετά την πτώση */
  .l2 span {
    display: inline-block;
    animation: sway 3.4s 4.0s ease-in-out infinite;
  }

  @keyframes logoIn {
    from { opacity: 0; transform: translate(-50%,-50%) scale(.72) rotateX(22deg); }
    to   { opacity: 1; transform: translate(-50%,-50%) scale(1)   rotateX(0deg); }
  }
  @keyframes pulse {
    0%,100% { opacity: .45; transform: scale(1); }
    50%     { opacity: .95; transform: scale(1.09); }
  }
  @keyframes drop1 {
    0%   { opacity: 0; transform: translateY(-58vh) rotateX(-78deg) scale(1.5); }
    62%  { opacity: 1; }
    100% { opacity: 1; transform: translateY(0) rotateX(0deg) scale(1); }
  }
  @keyframes drop2 {
    0%   { opacity: 0; transform: translateY(-46vh) rotateX(-70deg) scale(1.4); }
    62%  { opacity: 1; }
    100% { opacity: 1; transform: translateY(0) rotateX(0deg) scale(1); }
  }
  @keyframes sway {
    0%,100% { transform: translateY(0)    rotate(-1.1deg); }
    50%     { transform: translateY(-6px) rotate(1.1deg); }
  }
  @keyframes spark {
    0%   { opacity: 0; transform: translate(0,0) scale(.4); }
    12%  { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.2); }
  }
</style>
</head>
<body>
  <div id="stage">
    <div class="logo-wrap">
      <div class="halo"></div>
      <img src="LOGO.png" alt="">
    </div>
    <div class="line l1"><span class="p1">Privacy</span><span class="p2">YouTuber</span></div>
    <div class="line l2"><span>Your YouTube, on your own terms</span></div>
  </div>

<script>
  const stage = document.getElementById('stage');
  for (let i = 0; i < 48; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    const ang  = Math.random() * Math.PI * 2;
    const dist = 80 + Math.random() * 250;
    s.style.setProperty('--dx', (Math.cos(ang) * dist).toFixed(0) + 'px');
    s.style.setProperty('--dy', (Math.sin(ang) * dist).toFixed(0) + 'px');
    s.style.animationDelay = (1.0 + Math.random() * 3.0).toFixed(2) + 's';
    s.style.animationDuration = (1.6 + Math.random() * 1.8).toFixed(2) + 's';
    stage.appendChild(s);
  }
  setTimeout(() => {
    document.querySelectorAll('.spark').forEach(e => e.style.animationIterationCount = '1');
  }, 4200);
</script>
</body>
</html>
