<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PrivacyYouTuber — Outro</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #05070d;
    overflow: hidden;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  #stage {
    position: absolute; inset: 0;
    perspective: 1400px;
    perspective-origin: 50% 45%;
    display: flex; align-items: center; justify-content: center;
  }

  /* ── ΛΟΓΟΤΥΠΟ + GLOW ── */
  .logo-wrap {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -52%);
    width: 46vmin; height: 46vmin;
    opacity: 0;
    animation: logoIn 1.4s 0.2s ease-out forwards;
  }
  .logo-wrap img {
    width: 100%; height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 0 26px rgba(120,160,255,.55));
  }
  /* pulsing glow halo */
  .halo {
    position: absolute; inset: -14%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(108,140,255,.42) 0%, rgba(108,140,255,.14) 38%, transparent 68%);
    animation: pulse 2.6s 1s ease-in-out infinite;
    pointer-events: none;
  }

  /* ── ΣΠΙΘΕΣ ── */
  .spark {
    position: absolute;
    left: 50%; top: 50%;
    width: 3px; height: 3px;
    border-radius: 50%;
    background: #cfe0ff;
    box-shadow: 0 0 8px 2px rgba(150,180,255,.9);
    opacity: 0;
    animation: spark 2.4s ease-out infinite;
  }
  @keyframes spark {
    0%   { opacity: 0; transform: translate(0,0) scale(.4); }
    12%  { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.25); }
  }

  /* ── 3D ΚΕΙΜΕΝΟ ΠΟΥ ΠΕΦΤΕΙ ── */
  .line {
    position: absolute;
    left: 0; right: 0;
    text-align: center;
    transform-style: preserve-3d;
    will-change: transform, opacity;
  }
  .l1 {
    top: 70%;
    font-size: 6.4vmin;
    font-weight: 800;
    letter-spacing: .5px;
    color: #fff;
    text-shadow: 0 0 18px rgba(120,160,255,.85), 0 0 46px rgba(90,130,255,.5);
    animation: drop1 1.5s 1.6s cubic-bezier(.2,.85,.3,1) both;
  }
  .l2 {
    top: 80.5%;
    font-size: 3.5vmin;
    font-weight: 500;
    letter-spacing: 2.4px;
    text-transform: uppercase;
    color: #b9c8ee;
    text-shadow: 0 0 14px rgba(120,160,255,.6);
    animation: drop2 1.5s 2.5s cubic-bezier(.2,.85,.3,1) both;
  }

  @keyframes logoIn {
    from { opacity: 0; transform: translate(-50%,-52%) scale(.72) rotateX(22deg); }
    to   { opacity: 1; transform: translate(-50%,-52%) scale(1)   rotateX(0deg); }
  }
  @keyframes pulse {
    0%,100% { opacity: .5;  transform: scale(1); }
    50%     { opacity: 1;   transform: scale(1.09); }
  }
  @keyframes drop1 {
    0%   { opacity: 0; transform: translateY(-58vh) rotateX(-78deg) scale(1.5); }
    62%  { opacity: 1; }
    100% { opacity: 1; transform: translateY(0) rotateX(0deg) scale(1); }
  }
  @keyframes drop2 {
    0%   { opacity: 0; transform: translateY(-46vh) rotateX(-70deg) scale(1.4); }
    62%  { opacity: 1; }
    100% { opacity: 1; transform: translateY(0) rotateX(0deg) scale(1); }
  }
</style>
</head>
<body>
  <div id="stage">
    <div class="logo-wrap">
      <div class="halo"></div>
      <img src="LOGO.png" alt="">
    </div>
    <div class="line l1">PrivacyYouTuber</div>
    <div class="line l2">Your YouTube, on your own terms</div>
  </div>

<script>
  // Σπίθες — τυχαίες τροχιές γύρω από το λογότυπο
  const stage = document.getElementById('stage');
  for (let i = 0; i < 42; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    const ang  = Math.random() * Math.PI * 2;
    const dist = 90 + Math.random() * 240;
    s.style.setProperty('--dx', (Math.cos(ang) * dist).toFixed(0) + 'px');
    s.style.setProperty('--dy', (Math.sin(ang) * dist).toFixed(0) + 'px');
    s.style.animationDelay = (1.0 + Math.random() * 3.0).toFixed(2) + 's';
    s.style.animationDuration = (1.6 + Math.random() * 1.8).toFixed(2) + 's';
    stage.appendChild(s);
  }
  // Σταμάτα τις σπίθες μετά το τέλος (για record)
  setTimeout(() => {
    document.querySelectorAll('.spark').forEach(e => e.style.animationIterationCount = '1');
  }, 4200);
</script>
</body>
</html>
